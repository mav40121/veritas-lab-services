name: PDF signature guard

# Hard CI gate: the VeritaCheck method-comparison director signature block MUST
# render on page 1 (PDF rule 5). It regressed silently in Sep 2026 when
# cumulative page-1 growth (a longer narrative + the taller electronically-signed
# block) pushed the atomic signature block onto page 2. Nothing tested actual
# page placement, so it slipped through every existing check (math/content only).
#
# scripts/verify-methodcomp-signature-page1.ts renders the worst realistic case
# (a signed, long-narrative troponin method comparison with excluded points) to
# the real print geometry and fails if the signature block does not fit within
# page 1, with headroom so creeping growth is caught BEFORE it tips over.
#
# To make this block merges, enable in:
#   Settings -> Branches -> main -> Branch protection ->
#   Require status checks to pass before merging -> select "pdf-signature-guard".

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  pdf-signature-guard:
    name: pdf-signature-guard
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # A PDF section heading keeps with what follows it (2026-11-03: a 14-method VeritaComp record printed
      # "Competency by method" alone at the bottom of page 1). Every h2 rule in a PDF builder carries break-after: avoid.
      - name: PDF headings keep with their content
        run: node scripts/verify-pdf-heading-keep.mjs

      # Puppeteer needs a Chrome binary plus the headless system libraries.
      # playwright (a devDependency) provides the OS libs via install-deps; the
      # browser itself comes from puppeteer's own cache.
      - name: Install headless Chrome system libraries
        # 2026-11-11: if the Ubuntu package servers are unreachable, carry on with the runner image's own libraries;
        # the PDF checks below still fail if Chrome cannot start.
        run: timeout 300 npx playwright install-deps chromium || echo "::warning::apt unreachable; using the runner image libraries"

      - name: Ensure Puppeteer Chrome is present
        run: npx puppeteer browsers install chrome

      # server/pdfContent.ts: every PDF waits for load + web fonts + images (Puppeteer 25 dropped networkidle0 for
      # setContent); a broken image must not hold a PDF and a hung resource stops at the timeout.
      - name: PDF content wait
        run: npx tsx scripts/verify-pdf-content-wait.ts

      - name: Signature-on-page-1 guard
        run: npx tsx scripts/verify-methodcomp-signature-page1.ts

      # VeritaResponse entry-type reports (PT, alternative assessment, FDA deviation, QC event; 2026-10-26): review block
      # on page 1 for typical and very long entries, the real PDF renders, content and escaping.
      - name: VeritaResponse type reports guard
        run: npx tsx scripts/verify-veritaresponse-type-reports.ts

      # Six analyzers on a Calibration Verification and on a Method Comparison (BUG-056/058 page 1 per analyzer).
      - name: Multi-analyzer signature-on-page-1 guard
        run: npx tsx scripts/verify-multi-analyzer-signature-page1.ts
