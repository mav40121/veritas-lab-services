name: Signup Gating

# Standing integration test for the signup-gating fix (2026-07-17).
#
# The leak: a self-service signup wrote the visitor's PICKED tier straight into
# users.plan, and the study gate treats any paid plan as unlimited, so picking
# Community at signup granted unlimited access for $0 (Rachel Hermosilla, Troy
# Regional). It survived because every existing test asked "does the feature
# WORK" -- and an over-provisioned account works perfectly. The only thing that
# catches it is a NEGATIVE assertion: a new account must be gated. That never
# existed until this test.
#
# tests/integration/signup-gating.test.ts boots the REAL Express routes against a
# throwaway SQLite DB and drives real HTTP: register PICKING Community, assert the
# account lands plan=free with 2 credits, then assert the study endpoint blocks it
# at the credit boundary (402 STUDY_CREDITS_EXHAUSTED). Both the plan check and the
# block check independently go red if the leak regresses (proven by injecting the
# old behavior). Runs against a temp DB with test secrets -- never touches prod.
#
# To make this block merges, enable in:
#   Settings -> Branches -> main -> Branch protection ->
#   Require status checks to pass before merging -> select "signup-gating".

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  signup-gating:
    name: signup-gating
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run signup-gating integration test
        # The npm script sets DB_PATH to a throwaway file plus the test secrets the
        # server requires to boot, then runs the test via tsx. No prod, no network.
        run: npm run test:signup-gating

      - name: Run session sign-out integration test
        # Two-factor sign-in Stage 1 (server/sessionAuth.ts): after sign-out, a
        # password change, force-logout or the admin kill switch, the old token
        # must be refused; and no server file but sessionAuth.ts may call
        # jwt.verify. Same throwaway DB and test secrets pattern as above.
        run: npm run test:session-signout
      - name: Run CLIA placeholder save integration test
        # A placeholder CLIA never blocks a settings save; locked real CLIAs stay locked; support can replace a locked
        # placeholder once (2026-10-21 lab 21, 2026-10-27 lab 18). Passed locally, not in CI before 2026-10-27.
        run: npm run test:clia-placeholder-save

      - name: Run two-factor sign-in integration test
        # Two-factor sign-in Stage 2 (server/twoFactor.ts, server/twoFactorRoutes.ts): RFC 6238
        # vectors; a password alone must not open an enrolled account; step tokens open nothing
        # else; used codes fail; reset links, new accounts in a requiring lab and Veritas support
        # accounts all land on the second step; lab owner switch and resets.
        run: npm run test:two-factor
      - name: Run system security settings integration test
        # System security settings (server/securityPolicy.ts; Michael Q27 = 1): idle sign-out, password
        # expiry, history, lockout, inactive accounts and the symbol rule each bite inside the owner's
        # system and stay off outside it; owners unlock and turn accounts back on; every password write
        # goes through setUserPassword.
        run: npm run test:security-settings
      - name: Run first-lab owner membership integration test
        # Labs are set up by Veritas staff (Q195); a provisioned owner gets an active owner row and can open the lab;
        # the boot backfill covers only pre-2026-10-14 accounts (parking lot #83, updated 2026-10-27).
        run: npm run test:first-lab-owner-membership
      - name: Run VeritaPolicy staff attestation integration test
        # BUG-079: staff complete their own assigned attestation (record work); setup stays owner/admin/edit.
        run: npm run test:policy-attest-staff
      - name: Run VeritaDC sub-manuals integration test
        # Q151 = 1 (2026-11-03): manuals nest to any depth (policy_manuals.parent_id); tree order and full paths; no
        # cycles, no cross-lab parents, depth limit; a parent with sub-manuals can't be archived; moves are audited.
        run: npm run test:veritadc-submanuals
      - name: Run VeritaDC document numbers and versions integration test
        # Q154 (2026-11-03): per-lab document numbers (unique among active documents), 1.0 / 1.1 / 2.0 versions with
        # legacy versions reading N.0, number edits audited, no move into another lab's manual.
        run: npm run test:veritadc-doc-numbers
      - name: Verify the VeritaDC bulk load rules
        # Step E (2026-11-06): title cleaning, dates, versions, which rows load, lab and manual placement, review notices.
        run: npx tsx scripts/verify-veritadc-carried-over.mts
      - name: Run VeritaDC bulk load integration test
        # Step E (2026-11-06): documents carried over from a prior system keep their number, version and real dates, with
        # the face page attached and no signature in VeritaAssure; safe to rerun; no read-and-sign and no email; reminders
        # held to a start date; a past-due document stays overdue, not expired; the real load script runs against the routes.
        run: npm run test:veritadc-bulk-load
      - name: Run VeritaDC document types integration test
        # Q154 (2026-11-03): per-lab rule per type (periodic review, read-and-sign, default interval), applied at upload,
        # approval/re-certify and type change; a no-read-and-sign type can't be assigned and leaves the staff list.
        run: npm run test:veritadc-doc-types
      - name: Run VeritaDC minor-revision rule integration test
        # Q154 = 1 (2026-11-03): per-lab choice, default re-sign; carry-forward keeps signatures across minor revisions,
        # says so on the staff list, and never crosses a major revision.
        run: npm run test:veritadc-minor-revisions
      - name: Run VeritaDC approval routes integration test
        # Michael 2026-11-04 (Q155 = 1): a step goes to a role, a named person, or any one member of a group; owners and admins
        # change routes, every change is audited, a route with documents in review is locked, signed steps keep their history.
        run: npm run test:veritadc-approval-routes
      - name: Run histology VeritaMaintain entries integration test
        # Michael 2026-11-04 (Q161 = 1): a stainer solution change names who and what and never moves the PM date; a humidity
        # unit reads in percent, only a humidity unit can, and a change can't leave a type and scale that don't match.
        run: npm run test:histology-maintain-entries
      - name: Run staff roster one-list integration test
        # Michael 2026-11-04 (Redington): a typed Staff invite links to the existing roster row; everyone on the roster shows on Lab
        # Members; a second card an invite already made folds into the real one unless it holds real work.
        run: npm run test:staff-roster-one-list
      - name: Run VeritaComp past competency dates integration test
        # Michael 2026-11-04 (Q164 = 1): the bulk import template comes filled in per person and method, the date sets the due date with no program,
        # a live sign-off wins, another lab's file is refused, and a loaded date can be taken back.
        run: npm run test:competency-method-history
      - name: Run VeritaComp waived specimens integration test
        # Cathy Thornton (RFGH) 2026-11-04: waived blind specimen testing takes several specimens and passes only when every one did; a non-technical
        # assessment can be a 6-Month or an Annual.
        run: npm run test:competency-waived-specimens
      - name: Run Staff own competency data integration test
        # Michael 2026-11-05 (Cathy Thornton, RFGH): a Staff login enters the factual data on their OWN record. The observer, Pass, N/A, Acceptable and
        # Element 4 stay as stored whatever is sent; another person, another lab, a signed item and a locked record are out of reach; a lapsed lab takes no
        # entry; the implicit container is never asked to be acknowledged.
        run: npm run test:staff-own-competency-data
      - name: Competency clearance rule
        # Only a technical or waived record can clear a person for patient testing; what an import builds from what's left, on known dates.
        run: npx tsx scripts/verify-competency-clearance-types.mts
      - name: Run competency clearance by program type integration test
        # 2026-11-06: a non-technical record never clears anyone: Bulk Import, whole-record sign on both routes, the admin backfill and duty-change events. Technical and
        # waived still do. A new row stores the program's type, older rows read by it, and what's already on file stays as it is.
        run: npm run test:competency-clearance-program-type
      - name: Run competency Needs review integration test
        # Michael 2026-11-05, Q179 = 1: an unsigned entry with data and no Pass reads Needs review, never FAIL. A Pass sign-off needs every element marked
        # Pass or N/A on every route that writes one; Fail and Remediation Required stay allowed. Signed records keep their real result.
        run: npm run test:competency-needs-review
      - name: Run unscoped read lab isolation integration test
        # 2026-11-06: someone with no membership in a lab opened its quiz through GET /api/veritacomp/quizzes/:id. A read of a lab-owned row by id, on a route
        # with no lab in its path, must not cross labs. Every route of that shape is called as outsiders, and a new one fails until it is listed.
        run: npm run test:unscoped-read-isolation
      - name: Run study sign-in integration test
        # Michael 2026-11-06, Q193 = 1: signing in is required to save or open a study. Studies with no owner stay in place and unopened, even signed in.
        run: npm run test:study-signin-required
      - name: Run sister lab row access integration test
        # Michael 2026-11-06, Q191 = 1: matching a record's owner counts only for the owner, a record with no lab, a seat in that record's lab, an older seat
        # with no lab, or an older seat whose holder has no membership anywhere. A new seat can't fall into the last two. Both lab resolvers follow it.
        run: npm run test:sister-lab-row-access
      - name: Run competency program delete integration test
        # Michael 2026-11-06, Q184 = 1: a program holding competency records can't be deleted, on either route: 409 with the count, nothing removed. An empty
        # program still deletes with its setup. The count never reaches someone who can't delete there.
        run: npm run test:competency-program-delete
      - name: Non-technical competency frequency math
        # Michael 2026-11-04, Q216 = 1: the due date from a person's signed records, the status at each boundary, and the technical dates on the same known inputs.
        run: npx tsx scripts/verify-nontechnical-frequency.mts
      - name: Run non-technical competency frequency integration test
        # A site sets how often non-technical competency comes due; owner or admin only; blank leaves records with no due date. Every technical reader answers the
        # same at every setting, a save rewrites no record, reminders follow it and clearing it restores them, and a Staff login sees only their own rows.
        run: npm run test:competency-nontechnical-frequency
      - name: Run admin access audit counts integration test
        # 2026-11-06: GET /api/admin/access-audit-counts gives numbers only, for sizing the access work. Exact counts on made-up rows, no names, emails or
        # lab ids in the answer, writes nothing, and refuses with no secret, a wrong secret, a secret in the URL, or no secret set on the server.
        run: npm run test:admin-access-audit-counts
      - name: VeritaCheck recognizes every regulated analyte
        # Every row of the Subpart I table, direct, fallback and negative name cases, a lab's own criterion, and the frozen self-heal list.
        run: DB_PATH=.tmp-verify-reg.db npx tsx scripts/verify-regulated-analyte-labels.ts
      - name: Run regulated analyte labels integration test
        # A saved study named for a newly recognized analyte stays byte-identical through the startup pass; the pass still heals what it healed;
        # a re-rendered report labels it CLIA TEa or Lab-Set Internal Goal with the true CFR section, and never says "no criterion exists" of a regulated analyte.
        run: npm run test:regulated-analyte-labels
      - name: VeritaCheck reports make no ADLM half-TEa claim
        # Q210 = 1 (Michael 2026-11-06): no source exists. Every narrative branch that carried the sentence, percentage and absolute TEa, inside half, between half and full, and failing:
        # no ADLM wording, no half value, the determination unchanged, the closing sentence last.
        run: DB_PATH=.tmp-verify-adlm.db npx tsx scripts/verify-no-adlm-half-tea-reports.ts
      - name: No ADLM half-TEa claim in client, server or shared
        # script/audit.py runs in the pre-commit hook, which a commit can skip. This proves its ADLM check bites, leaves the real ADLM mentions alone, and scans the tree.
        run: python3 scripts/verify-adlm-claim-audit.py
      - name: Run manual method groups integration test
        # Michael 2026-11-04: manual tests can be grouped with each other, one complexity, never with an analyzer (BUG-043 protection).
        run: npm run test:manual-method-groups
      - name: Run VeritaStock tissue integration test
        # Heywood, REQ-106, Michael Q152 = 1: no patient field anywhere, PHI refused on every write, expired or a read-back that isn't yes can't be issued, exactly one
        # final disposition, lookup and recall by tissue ID, the log workbook, the admin catalog load (dry run by default), and 404 on veritastock.com.
        run: npm run test:veritastock-tissue
      - name: Run quiz follows method group integration test
        # REQ-131: an analyzer grouped on the Method groups tab shows on the quiz form and card. Nothing is stored: program rows, quizzes and what a program
        # credits stay the same. The Element 6 picker's old matches still win, and a group only fills in where it found nothing.
        run: npm run test:quiz-follows-group
      - name: Run demo fixture rename integration test
        # Michael Q190 = 1: the demo lab fixture is Sample Regional Medical Center, because a real hospital has the old name. Nothing in the repo uses the old name; a deploy renames
        # no existing row; the admin rename is a dry run by default, moves only the fixture, and never a customer row with the same name.
        run: npm run test:demo-fixture-rename
      - name: Run VeritaScan auto-completion integration test
        # Site review 2026-11-05: a passing assessment marks only what its record supports (technical: item 60, with all six procedures shown;
        # waived and non-technical: nothing), a draft or failed study marks nothing, the lab's own answer stays, and the admin audit is counts only.
        run: npm run test:competency-scan-items
      - name: Run VeritaScan mark correction integration test
        # Michael Q189 = 1: the admin correction is a dry run by default and its answer has no names. It moves only marks the records don't support, keeps every row
        # carrying the lab's own work, ignores the timestamp the scan screen's auto-save rewrites, and writes only for the count the dry run gave.
        run: npm run test:veritascan-mark-correction
      - name: Run VeritaDC readiness report integration test
        # Site review 2026-11-05: the PDF reads what the tracker screen saves and lists the screen's rows, so its score and counts are the screen's;
        # the old requirement table never reaches it, and one lab's entries never reach another's report.
        run: npm run test:veritadc-readiness-report
      - name: Run email verification integration test
        # Michael 2026-11-05: a public sign-up can't sign in or hold a seat until its owner confirms the address with the link and the
        # password they chose. An invitation's link proves the address it was mailed to. Sign-up again replaces an unconfirmed account.
        run: npm run test:email-verification
      - name: Run invite token visibility integration test
        # 2026-11-04: an invite token claims its seat, an admin seat included, so only people who manage members get it. Surveyor link
        # tokens go to VeritaDC editors only. The invite link and the surveyor link still work.
        run: npm run test:invite-token-visibility
      - name: Run instrument staff bulk assign integration test
        # Michael 2026-11-04: tick several instruments and the staff picked go on every one. Only adds; another lab's instrument or person
        # refuses the whole request; a new pairing past the setup session flags a reassessment.
        run: npm run test:instrument-staff-bulk
      - name: Run VeritaMaintain monthly review integration test
        # Michael 2026-11-04 (Q161 = 1): the medical director or a named designee signs each record for a month; a problem needs a
        # corrective action; what was signed is kept, and a later entry shows as added after the review.
        run: npm run test:maintain-monthly-review
      - name: Run VeritaMaintain stain log integration test
        # Michael 2026-11-06 (Q178 = 1): a month grid with the lab's own rows and codes, lot and expiration on a stain change, a manual
        # list with no specimen number, one review with the rest of VeritaMaintain, Staff record, and the ROSE blank form in VeritaDC.
        run: npm run test:maintain-stain-log
      - name: Run VeritaDC signature status integration test
        # Michael 2026-11-04 (Q161 = 1): the roster shows who signed by either path; a Staff login signature closes their assignment,
        # but not a required quiz or a newer version; the bell lists what is left; the Excel report carries the roster.
        run: npm run test:veritadc-signature-status
      - name: Run VeritaDC signature history carry-over integration test
        # Michael 2026-11-06 (Q207 = 1): a read-and-sign from the prior system keeps its original date and counts as signed for that version.
        # Nothing reads as signed in VeritaAssure; no email, assignment or login; a person is never guessed; the script is safe to rerun.
        run: npm run test:veritadc-history-load
      - name: Run VeritaDC read-and-sign by group integration test
        # Step D of Heywood's move: a Staff login sees and signs only what's assigned to them. A document, manual or the whole lab goes to groups,
        # named people or everyone; new documents and new group members follow; assigning sends no email; coworkers' status stays hidden.
        run: npm run test:veritadc-read-sign-groups
      - name: Run VeritaDC staff approvals integration test
        # Michael 2026-11-04 (Q155 = 1): a staff login named on a route step or in its group reads and signs with typed name and password, using
        # no editing seat. Nobody else can open it, a changed document is refused, and the editor's approve and reject paths are unchanged.
        run: npm run test:veritadc-staff-approvals
      - name: Run structure-only database copy integration test
        # GET /api/admin/schema-db (Lifepoint questionnaire: customer data is not used for testing): secret-gated, every
        # table, index, view and trigger rebuilt with the same columns, no rows, nothing from the source in the file, audited.
        run: npm run test:schema-db
      - name: Sentry sends no personal information
        # shared/sentryDataCollection.ts (Sentry 11 dataCollection): a request that throws with a cookie, headers, a JSON
        # body, query values and a forwarded IP; the outgoing envelope must carry none of them.
        run: npx tsx scripts/verify-sentry-data-collection.ts
      - name: Run record-view logging integration test
        # Record-view logging and the access report (server/recordViews.ts; Lifepoint IPS III.1(i)): a signed-in
        # read is logged once per 10 minutes per address; failed and anonymous reads are not; nothing is ever
        # written into a lab the person does not belong to; owner/admin only; role, permission, removal and
        # ownership changes are audited.
        run: npm run test:record-views
      - name: Run study notes integration test
        # VeritaCheck study notes (study_notes): members read, writers add, view-only and other customers cannot;
        # a signed study takes notes unchanged; author or owner/admin removes (tombstone); audited; deleted with the study.
        run: npm run test:study-notes
      - name: Run lab-keyed CLIA certificate integration test
        # VeritaLab CLIA certificate per lab, numbered from labs.clia_number (parking lot #92).
        run: npm run test:clia-cert-lab-keyed
      - name: Run VeritaLab export columns integration test
        # The certificate export carries the CLIA certificate type and link; Status stays column 8 (parking lot #103).
        run: npm run test:veritalab-export-columns
      - name: Run VeritaLab clear blank fields integration test
        # Emptying a box on a certificate clears it on both edit routes; a field left out stays; no expiration, no reminders.
        run: npm run test:veritalab-clear-blank-fields
      - name: Run QC finding reminder integration test
        # A reminder for a finding escalated from VeritaQC names the test, level, lot, run date and instrument (parking lot #99).
        run: npm run test:finding-reminder-qc
      - name: VeritaTrack sign-off to VeritaMap writeback
        # Writes the completion date onto the sign-off's own lab's map (#1177), warns on a name mismatch.
        run: npx tsx scripts/verify-veritatrack-map-sync.mts
      - name: Lab-local today and the UTC-date ratchet
        # labLocalDate/addLabDays on evening instants; routes.ts UTC calendar dates may only go down (parking lot #97).
        run: npx tsx scripts/verify-lab-local-today.ts
      - name: Run VeritaPolicy requirement status lab-scope integration test
        # One owner, two labs: a requirement edit on lab A never overwrites lab B (UNIQUE(lab_id, requirement_id)).
        run: npm run test:requirement-status-labscope
      - name: Run QC void settles its finding integration test
        # Voiding a QC run closes its untouched VeritaResponse finding or flags a worked one (parking lot #100).
        run: npm run test:qc-void-finding
      - name: No customer-facing Staff Portal wording
        # Parking lot #101: staff seats / staff login since 2026-10-09; comments and identifiers are ignored.
        run: node scripts/verify-no-staff-portal-wording.mjs
      - name: Run ISO 15189 accreditation integration test
        # ISO 15189 add-on (#108): findings table rebuilt to accept ISO with rows, indexes and child rows intact;
        # settings round trip and audit; ISO findings gated by the lab flag and take the lab-entered due date.
        run: npm run test:iso-15189
      - name: Run account settings partial save integration test
        # A save that leaves out the CLIA, lab name or PT vendor keeps them; blanks still clear (2026-10-27).
        run: npm run test:settings-partial-save
      - name: Run per-lab time zone integration test
        # Zone from labs.time_zone, else the CLIA state, else Eastern; lab-scoped stamps use the lab's day (2026-10-26).
        run: npm run test:lab-time-zone
      - name: Run VeritaScan auto-complete lab scope integration test
        # BUG-074: a study completes its own lab's scan items only and never overwrites the lab's own answer.
        run: npm run test:veritascan-autocomplete-lab
      - name: Run reminder jobs on the lab's day integration test
        # PT, equipment, finding and policy-review reminders run at midnight UTC; each lab's due dates count from that
        # lab's own calendar day (Guam vs American Samoa labs), so nothing goes out a day early (2026-10-27).
        run: npm run test:reminders-lab-day
      - name: Run VeritaCheck draft save integration test
        # BUG-092: a draft that omits or sends arrays for the data saves as JSON text (was a 500).
        run: npm run test:study-draft-save
      - name: Lab-local dates and zone rules
        run: npx tsx scripts/verify-lab-local-date.ts
      - name: No UTC today in client code
        run: node scripts/verify-client-lab-today.mjs
      - name: "Stored stamps shown as the lab's day (labDayOfStamp)"
        run: npx tsx scripts/verify-lab-day-of-stamp.ts
      - name: Run VeritaTrack categories and Weekly integration test
        # #110 per-lab categories (owner/admin add, rename, retire; built-ins stay) and #111 Weekly (7-day interval,
        # 2-day due-soon window, day-before reminder), Michael 2026-10-26.
        run: npm run test:veritatrack-categories-weekly
      - name: Run VeritaTrack reminder groups integration test
        # A lab's groups (Michael 2026-11-04): who gets which reminders, one email per person, nothing silently dropped.
        run: npm run test:veritatrack-reminder-groups
      - name: VeritaTrack reminder routing
        run: npx tsx scripts/verify-veritatrack-owner-reminders.mts
      - name: VeritaTrack due dates and reminder decisions
        run: npx tsx scripts/verify-veritatrack-reminders.mts
      - name: VeritaTrack frequency derivation
        run: node scripts/verify-veritatrack-frequency.mjs
      - name: Run VeritaResponse entry-type templates integration test
        # Per-type clocks and fields (PT, NCE, QC and alternative-assessment escalations), type_details sanitizing,
        # closing only through the gated sign-off (Michael 2026-10-26, mock D1-D7).
        run: npm run test:finding-type-templates
      - name: Run VeritaResponse legacy cleanup integration test
        # #109: dry run by default; voided-run findings close or flag (the #100 rule); old QC/AAA escalations move to
        # their entry types with due dates kept; idempotent.
        run: npm run test:veritaresponse-legacy-cleanup
      - name: VeritaResponse copy truth (suite page, demo, intro card, finding page)
        run: node scripts/verify-veritaresponse-copy-truth.mjs
      - name: Run correlation run details integration test
        # Run details (lots, dates, specimen) save, edit, clear, normalize, lock with sign-off and carry into an amendment.
        run: npm run test:correlation-run-details
      - name: Correlation run details on the report
        # Supporting Data prints them after the director's review, escaped; page 1 unchanged.
        run: npx tsx scripts/verify-correlation-run-details.mts
      - name: Run stale lab-owner row integration test
        # A leftover lab_members 'owner' row on someone who is not labs.owner_user_id gave a second
        # owner (San Carlos lab 2, 2026-10-15). repair-lab-admins demotes it to admin and never touches
        # the real owner; the Members PATCH lets the real owner fix one and still protects their own row.
        run: npm run test:stale-owner-row
      - name: Run single sign-on integration test
        # Single sign-on (server/sso.ts, server/ssoRoutes.ts) against a mock OpenID Connect provider:
        # forged, unsigned, HMAC, expired, wrong-audience, wrong-issuer and wrong-nonce tokens refused;
        # state and handoff single-use; PKCE; domain, no-account and support-account refusals; required
        # SSO blocks password sign-in and password reset for its domain.
        run: npm run test:sso
      - name: Run PHI guard integration test
        # Shared detectors; uploads warn (templates with blank fields do not); nightly scan logs counts, never values.
        run: npm run test:phi-guard
      - name: Install Litestream (same pinned, checksum-verified release as the Dockerfile)
        run: |
          wget -q -O /tmp/litestream.deb "https://github.com/benbjohnson/litestream/releases/download/v0.5.17/litestream-0.5.17-linux-x86_64.deb"
          echo "a191a0928884d1820fab1f866ede1d0d5811c323d0587bf863a43481a82a7668  /tmp/litestream.deb" | sha256sum -c -
          sudo dpkg -i /tmp/litestream.deb
          litestream version
      - name: Run continuous backup integration test
        # Litestream round trip on Linux against a local folder replica: WAL switch, a change made 5 s before a
        # restore is in the restored copy, integrity ok, a killed Litestream restarts, shutdown stops it.
        env:
          LITESTREAM_BIN: litestream
          LITESTREAM_FILE_REPLICA: /tmp/litestream-replica
        run: npm run test:continuous-backup
      - name: Run clear-backfill-values integration test
        # BUG-068 cleanup: clears only the made-up competency values; signed records, excluded labs and real values untouched.
        run: npm run test:clear-backfill-values
      - name: Run export-all integration test
        # Download all records: every table classified, owner-only, works after cancellation and trial expiry,
        # only this lab's rows, no sign-in secrets, plan gates open only for the export job.
        run: npm run test:export-all
      - name: Run VeritaMap SOP link integration test
        # Parking lot #93: a test's SOP reads its linked VeritaDC policy's review state; unlinked keeps its date.
        run: npm run test:veritamap-sop-link
      - name: Run VeritaStock recall tracker integration test
